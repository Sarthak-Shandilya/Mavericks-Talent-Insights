version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mavericks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  activemq:
    image: rmohr/activemq:5.15.9
    ports:
      - "61613:61613"
      - "8161:8161"

  api:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  ingestion-service:
    image: python:3.11-slim
    working_dir: /app/microservices/ingestion_service
    volumes:
      - ./:/app
    command: sh -c "pip install -r requirements.txt && python main.py"
    env_file:
      - ./microservices/ingestion_service/.env
    depends_on:
      - postgres

volumes:
  pgdata:
